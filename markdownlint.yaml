# Default state for all rules
default: true

# Path to configuration file to extend
extends: null

# MD001/heading-increment : Heading levels should only increment by one level at a time : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md001.md
MD001:
  front_matter_title: ^\s*title\s*[:=] # RegExp for matching title in front matter

# MD003/heading-style : Heading style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md003.md
MD003:
  style: consistent # Heading style

# MD004/ul-style : Unordered list style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md004.md
MD004:
  style: consistent # List style

# MD005/list-indent : Inconsistent indentation for list items at the same level : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md005.md
MD005: true

# MD007/ul-indent : Unordered list indentation : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md007.md
MD007:
  indent: 2 # Spaces for indent
  start_indented: false # Whether to indent the first level of the list
  start_indent: 2 # Spaces for first level indent (when start_indented is set)

# MD009/no-trailing-spaces : Trailing spaces : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md009.md
MD009:
  br_spaces: 2 # Spaces for line break
  code_blocks: false # Include code blocks
  list_item_empty_lines: false # Allow spaces for empty lines in list items
  strict: false # Include unnecessary breaks

# MD010/no-hard-tabs : Hard tabs : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md010.md
MD010:
  code_blocks: true # Include code blocks
  ignore_code_languages: [] # Fenced code languages to ignore
  spaces_per_tab: 1 # Number of spaces for each hard tab

# MD011/no-reversed-links : Reversed link syntax : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md011.md
MD011: true

# MD012/no-multiple-blanks : Multiple consecutive blank lines : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md012.md
MD012:
  maximum: 1 # Consecutive blank lines

# MD013/line-length : Line length : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md013.md
MD013:
  line_length: 150 # Number of characters
  heading_line_length: 150 # Number of characters for headings
  code_block_line_length: 150 # Number of characters for code blocks
  code_blocks: true # Include code blocks
  tables: true # Include tables
  headings: true # Include headings
  strict: true # Strict length checking
  stern: false # Stern length checking

# MD014/commands-show-output : Dollar signs used before commands without showing output : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md014.md
MD014: true

# MD018/no-missing-space-atx : No space after hash on atx style heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md018.md
MD018: true

# MD019/no-multiple-space-atx : Multiple spaces after hash on atx style heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md019.md
MD019: true

# MD020/no-missing-space-closed-atx : No space inside hashes on closed atx style heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md020.md
MD020: true

# MD021/no-multiple-space-closed-atx : Multiple spaces inside hashes on closed atx style heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md021.md
MD021: true

# MD022/blanks-around-headings : Headings should be surrounded by blank lines : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md022.md
MD022:
  include_front_matter: false # Include front matter content
  lines_above: 1 # Blank lines above heading
  lines_below: 1 # Blank lines below heading

# MD023/heading-start-left : Headings must start at the beginning of the line : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md023.md
MD023: true

# MD024/no-duplicate-heading : Multiple headings with the same content : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md024.md
MD024:
  siblings_only: false # Only check sibling headings

# MD025/single-title/single-h1 : Multiple top-level headings in the same document : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md025.md
MD025:
  front_matter_title: ^\s*title\s*[:=] # RegExp for matching title in front matter
  level: 1 # Heading level

# MD026/no-trailing-punctuation : Trailing punctuation in heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md026.md
MD026:
  punctuation: .,;:!。，；：！ # Punctuation characters

# MD027/no-multiple-space-blockquote : Multiple spaces after blockquote symbol : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md027.md
MD027:
  list_items: true # Include list items

# MD028/no-blanks-blockquote : Blank line inside blockquote : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md028.md
MD028: true

# MD029/ol-prefix : Ordered list item prefix : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md029.md
MD029:
  style: one_or_ordered # List style

# MD030/list-marker-space : Spaces after list markers : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md030.md
MD030:
  ul_single: 1 # Spaces for single-line unordered list items
  ol_single: 1 # Spaces for single-line ordered list items
  ul_multi: 1 # Spaces for multi-line unordered list items
  ol_multi: 1 # Spaces for multi-line ordered list items

# MD031/blanks-around-fences : Fenced code blocks should be surrounded by blank lines : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md031.md
MD031:
  list_items: true # Include list items

# MD032/blanks-around-lists : Lists should be surrounded by blank lines : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md032.md
MD032: true

# MD033/no-inline-html : Inline HTML : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md033.md
MD033:
  allowed_elements: [] # Allowed elements
  table_allowed_elements: [] # Allowed elements in tables

# MD034/no-bare-urls : Bare URL used : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md034.md
MD034: true

# MD035/hr-style : Horizontal rule style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md035.md
MD035:
  style: consistent # Horizontal rule style

# MD036/no-emphasis-as-heading : Emphasis used instead of a heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md036.md
MD036:
  punctuation: .,;:!?。，；：！？ # Punctuation characters

# MD037/no-space-in-emphasis : Spaces inside emphasis markers : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md037.md
MD037: true

# MD038/no-space-in-code : Spaces inside code span elements : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md038.md
MD038: true

# MD039/no-space-in-links : Spaces inside link text : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md039.md
MD039: true

# MD040/fenced-code-language : Fenced code blocks should have a language specified : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md040.md
MD040:
  allowed_languages: [] # List of languages
  language_only: false # Require language only

# MD041/first-line-heading/first-line-h1 : First line in a file should be a top-level heading : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md041.md
MD041:
  allow_preamble: false # Allow content before first heading
  front_matter_title: ^\s*title\s*[:=] # RegExp for matching title in front matter
  level: 1 # Heading level

# MD042/no-empty-links : No empty links : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md042.md
MD042: true

# MD043/required-headings : Required heading structure : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md043.md
MD043:
  headings: null # List of headings
  match_case: false # Match case of headings

# MD044/proper-names : Proper names should have the correct capitalization : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md044.md
MD044:
  names: [] # List of proper names
  code_blocks: true # Include code blocks
  html_elements: true # Include HTML elements

# MD045/no-alt-text : Images should have alternate text (alt text) : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md045.md
MD045: true

# MD046/code-block-style : Code block style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md046.md
MD046:
  style: consistent # Block style

# MD047/single-trailing-newline : Files should end with a single newline character : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md047.md
MD047: true

# MD048/code-fence-style : Code fence style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md048.md
MD048:
  style: consistent # Code fence style

# MD049/emphasis-style : Emphasis style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md049.md
MD049:
  style: consistent # Emphasis style

# MD050/strong-style : Strong style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md050.md
MD050:
  style: consistent # Strong style

# MD051/link-fragments : Link fragments should be valid : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md051.md
MD051:
  ignore_case: false # Ignore case of fragments
  ignored_pattern: '' # Pattern for ignoring additional fragments

# MD052/reference-links-images : Reference links and images should use a label that is defined : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md052.md
MD052:
  ignored_labels: # Ignored link labels
    - x
  shortcut_syntax: false # Include shortcut syntax

# MD053/link-image-reference-definitions : Link and image reference definitions should be needed : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md053.md
MD053:
  ignored_definitions: # Ignored definitions
    - //

# MD054/link-image-style : Link and image style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md054.md
MD054:
  autolink: true # Allow autolinks
  inline: true # Allow inline links and images
  full: true # Allow full reference links and images
  collapsed: true # Allow collapsed reference links and images
  shortcut: true # Allow shortcut reference links and images
  url_inline: true # Allow URLs as inline links

# MD055/table-pipe-style : Table pipe style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md055.md
MD055:
  style: consistent # Table pipe style

# MD056/table-column-count : Table column count : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md056.md
MD056: true

# MD058/blanks-around-tables : Tables should be surrounded by blank lines : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md058.md
MD058: true

# MD059/descriptive-link-text : Link text should be descriptive : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md059.md
MD059:
  prohibited_texts: # Prohibited link texts
    - click here
    - here
    - link
    - more

# MD060/table-column-style : Table column style : https://github.com/DavidAnson/markdownlint/blob/v0.42.2/doc/md060.md
MD060:
  style: any # Table column style
  aligned_delimiter: false # Aligned delimiter columns
